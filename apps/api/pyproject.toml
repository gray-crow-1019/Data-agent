[project]
name = "data-analyst-agent-api"
version = "0.1.0"
description = "FastAPI backend for Data Analyst Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.26",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
