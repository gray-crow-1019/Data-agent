version: "3.9"

services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ./apps/web
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daa
      POSTGRES_PASSWORD: daa
      POSTGRES_DB: daa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
